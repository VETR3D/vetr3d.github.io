name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage project page
        run: |
          mkdir -p _site/static/css _site/static/js _site/static/images _site/static/pdfs
          cp index.html .nojekyll _site/
          cp static/css/bulma.min.css static/css/index.css _site/static/css/
          cp static/js/index.js static/js/fontawesome.all.min.js _site/static/js/
          cp -R static/images/vetr _site/static/images/
          cp -R static/pdfs/vetr _site/static/pdfs/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
